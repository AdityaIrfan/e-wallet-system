services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ewallet
      POSTGRES_PASSWORD: ewallet
      POSTGRES_DB: ewallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewallet"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ewallet:ewallet@postgres:5432/ewallet?sslmode=disable
      MIGRATIONS_PATH: file://migrations
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: